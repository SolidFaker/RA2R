# RA2R Release：打 tag 时构建并发布（Windows + Linux 二进制包）
#
# 产物：Windows zip（stage/mapview/mixbrowser/mixdump/... + SDL3.dll）
#       Linux tar.gz（同工具集，链接系统 SDL3）
# 不包含任何游戏素材；运行需玩家自备正版《尤里的复仇》。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            archive: ra2r-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            archive: ra2r-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libudev-dev libdbus-1-dev

      - name: Cache SDL3
        if: matrix.name == 'linux'
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ runner.os }}-3.4.14

      - name: Build SDL3
        if: matrix.name == 'linux' && steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.4.14 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3"
          cmake --build /tmp/SDL/build -j "$(nproc)"
          cmake --install /tmp/SDL/build

      - name: Install dependencies (Windows)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            zip

      - name: Configure (Linux)
        if: matrix.name == 'linux'
        run: >
          cmake -B build -G Ninja
          -DRA2R_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$HOME/sdl3"

      - name: Configure (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: >
          cmake -B build -G Ninja
          -DRA2R_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: cmake --build build -j "$(nproc)"

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: cmake --build build -j "$(nproc)"

      - name: Test (Linux)
        if: matrix.name == 'linux'
        run: |
          ./build/tools/gen_fixtures tests/fixtures
          ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          ./build/tools/gen_fixtures.exe tests/fixtures
          ctest --test-dir build --output-on-failure

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          set -e
          mkdir -p dist/ra2r
          cp build/tools/{stage,mapview,mixbrowser,mixdump,shpview,vxlview,assetcheck,cachebuild,smoketest,gen_fixtures} dist/ra2r/
          cp LICENSE README.md dist/ra2r/
          # Linux 运行需 SDL3 运行库（发行版包名不一，随包附上）
          cp "$(ldd build/tools/stage | awk '/libSDL3.so.0/ {print $3}')" dist/ra2r/ || true
          cp /usr/share/licenses/*/LICENSE.SDL3* dist/ra2r/ 2>/dev/null || true
          tar -C dist -czf "${{ matrix.archive }}" ra2r

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist/ra2r
          cp build/tools/{stage,mapview,mixbrowser,mixdump,shpview,vxlview,assetcheck,cachebuild,smoketest,gen_fixtures}.exe dist/ra2r/
          cp "$(cygpath -u "$MINGW_PREFIX")/bin/SDL3.dll" dist/ra2r/
          cp LICENSE README.md dist/ra2r/
          zip -r "${{ matrix.archive }}" dist/ra2r

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
